name: Schedule Probe - El Peruano

'on':
  # Prueba aislada del scheduler de GitHub; intervalo mínimo permitido.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar evento recibido
        run: |
          echo "GitHub Actions recibió el evento: ${{ github.event_name }}"
          echo "SHA ejecutado: ${{ github.sha }}"
          echo "Hora UTC del runner: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
